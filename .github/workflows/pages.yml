# Publishes the site to GitHub Pages on every push to main.
#
# Upstream (TeachingTools) has no workflow — it uses Pages' "deploy from a
# branch" source instead. This repo carries one so deployment doesn't depend on
# a settings toggle. Either source works; if this repo is ever switched to
# "deploy from a branch", delete this file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The site is served straight from the repo root — no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
